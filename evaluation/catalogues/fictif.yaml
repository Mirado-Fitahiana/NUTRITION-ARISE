# la chaîne filtrage → score → composition → validation avant que le catalogue
# réel existe (sprint 03). Il n'est jamais chargé en base, jamais servi à un
# utilisateur, et `laboratoire.charger_catalogue_fictif` refuse tout fichier
# qui ne porte pas `fictif: true`.
